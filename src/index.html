    <script>
        // 应用保存的缩放设置
        function applySavedScales() {
            const savedSummaryScale = sessionStorage.getItem('summaryScale') || '100';
            const savedHardwareScale = sessionStorage.getItem('hardwareScale') || '100';
            
            // 应用当前配置缩放
            const summaryPanel = document.querySelector('.summary-panel');
            if (summaryPanel) {
                summaryPanel.style.transform = `scale(${savedSummaryScale / 100})`;
                summaryPanel.style.transformOrigin = 'top left';
            }
            
            // 应用硬件选择区域缩放
            const contentArea = document.querySelector('.content-area');
            if (contentArea) {
                contentArea.style.transform = `scale(${savedHardwareScale / 100})`;
                contentArea.style.transformOrigin = 'left center';
            }
            
            applyFontSettings();
            applyHardwareFontSettings();
        }

        // 全局变量
        var priceScale = 1.0;

        // 初始化缩放控制
        function initScaleControls() {
            const summaryScaleSlider = document.getElementById('summary-scale-slider');
            const summaryScaleValue = document.getElementById('summary-scale-value');
            const hardwareScaleSlider = document.getElementById('hardware-scale-slider');
            const hardwareScaleValue = document.getElementById('hardware-scale-value');
            const fontSizeSlider = document.getElementById('font-size-slider');
            const fontSizeValue = document.getElementById('font-size-value');
            const summaryColsSlider = document.getElementById('summary-cols-slider');
            const summaryColsValue = document.getElementById('summary-cols-value');
            const partModelScaleSlider = document.getElementById('part-model-scale-slider');
            const partModelScaleValue = document.getElementById('part-model-scale-value');
            const partSpecsScaleSlider = document.getElementById('part-specs-scale-slider');
            const partSpecsScaleValue = document.getElementById('part-specs-scale-value');
            const fontSpacingSlider = document.getElementById('font-spacing-slider');
            const fontSpacingValue = document.getElementById('font-spacing-value');
            const hardwareFontSizeSlider = document.getElementById('hardware-font-size-slider');
            const hardwareFontSizeValue = document.getElementById('hardware-font-size-value');
            const totalPriceScaleSlider = document.getElementById('total-price-scale-slider');
            const totalPriceScaleValue = document.getElementById('total-price-scale-value');
            
            if (!summaryScaleSlider || !hardwareScaleSlider || !fontSizeSlider || !fontSpacingSlider || !hardwareFontSizeSlider || !partModelScaleSlider || !partSpecsScaleSlider || !summaryColsSlider) return;
            
            // 设置初始值
            const savedSummaryScale = sessionStorage.getItem('summaryScale') || '100';
            const savedHardwareScale = sessionStorage.getItem('hardwareScale') || '90';
            const savedFontSize = sessionStorage.getItem('fontSize') || '6';
            const savedSummaryCols = sessionStorage.getItem('summaryCols') || '2';
            const savedPartModelScale = sessionStorage.getItem('partModelScale') || '1.0';
            const savedPartSpecsScale = sessionStorage.getItem('partSpecsScale') || '1.5';
            const savedFontSpacing = sessionStorage.getItem('fontSpacing') || '2';
            const savedHardwareFontScale = sessionStorage.getItem('hardwareFontScale') || '1.0';
            const savedTotalPriceScale = parseFloat(sessionStorage.getItem('totalPriceScale') || '1.0');
            
            summaryScaleSlider.value = savedSummaryScale;
            summaryScaleValue.textContent = savedSummaryScale + '%';
            hardwareScaleSlider.value = savedHardwareScale;
            hardwareScaleValue.textContent = savedHardwareScale + '%';
            fontSizeSlider.value = savedFontSize;
            fontSizeValue.textContent = savedFontSize + 'px';
            summaryColsSlider.value = savedSummaryCols;
            summaryColsValue.textContent = savedSummaryCols + '列';
            partModelScaleSlider.value = savedPartModelScale;
            partModelScaleValue.textContent = savedPartModelScale + 'x';
            partSpecsScaleSlider.value = savedPartSpecsScale;
            partSpecsScaleValue.textContent = savedPartSpecsScale + 'x';
            fontSpacingSlider.value = savedFontSpacing;
            fontSpacingValue.textContent = savedFontSpacing + 'px';
            hardwareFontSizeSlider.value = savedHardwareFontScale;
            hardwareFontSizeValue.textContent = savedHardwareFontScale + 'x';
            
            if (totalPriceScaleSlider) {
                totalPriceScaleSlider.value = savedTotalPriceScale;
                totalPriceScaleValue.textContent = savedTotalPriceScale + 'x';
                priceScale = savedTotalPriceScale;
            }
            
            // 应用设置
            applyFontSettings();
            applySummaryCols();
            applyPartModelSettings();
            applyPartSpecsSettings();
            applyHardwareFontSettings();
            
            // 当前配置缩放控制
            summaryScaleSlider.addEventListener('input', function() {
                const scale = this.value;
                summaryScaleValue.textContent = scale + '%';
                sessionStorage.setItem('summaryScale', scale);
                
                const summaryPanel = document.querySelector('.summary-panel');
                if (summaryPanel) {
                    summaryPanel.style.transform = `scale(${scale / 100})`;
                    summaryPanel.style.transformOrigin = 'top left';
                }
            });
            
            // 硬件选择区域缩放控制
            hardwareScaleSlider.addEventListener('input', function() {
                const scale = this.value;
                hardwareScaleValue.textContent = scale + '%';
                sessionStorage.setItem('hardwareScale', scale);
                
                const contentArea = document.querySelector('.content-area');
                if (contentArea) {
                    contentArea.style.transform = `scale(${scale / 100})`;
                    contentArea.style.transformOrigin = 'left center';
                }
            });
            
            // 字体大小控制
            fontSizeSlider.addEventListener('input', function() {
                const size = this.value;
                fontSizeValue.textContent = size + 'px';
                sessionStorage.setItem('fontSize', size);
                applyFontSettings();
            });

            // 当前配置列数控制
            summaryColsSlider.addEventListener('input', function() {
                const cols = this.value;
                summaryColsValue.textContent = cols + '列';
                sessionStorage.setItem('summaryCols', cols);
                applySummaryCols();
            });

            // 当前配置型号大小控制
            partModelScaleSlider.addEventListener('input', function() {
                const scale = this.value;
                partModelScaleValue.textContent = scale + 'x';
                sessionStorage.setItem('partModelScale', scale);
                applyPartModelSettings();
            });

            // 当前配置详细信息大小控制
            partSpecsScaleSlider.addEventListener('input', function() {
                const scale = this.value;
                partSpecsScaleValue.textContent = scale + 'x';
                sessionStorage.setItem('partSpecsScale', scale);
                applyPartSpecsSettings();
            });
            
            // 字体间距控制
            fontSpacingSlider.addEventListener('input', function() {
                const spacing = this.value;
                fontSpacingValue.textContent = spacing + 'px';
                sessionStorage.setItem('fontSpacing', spacing);
                applyFontSettings();
            });

            // 硬件列表字体大小控制
            hardwareFontSizeSlider.addEventListener('input', function() {
                const scale = this.value;
                hardwareFontSizeValue.textContent = scale + 'x';
                sessionStorage.setItem('hardwareFontScale', scale);
                applyHardwareFontSettings();
            });

            // 总金额大小控制
            if (totalPriceScaleSlider) {
                totalPriceScaleSlider.addEventListener('input', function() {
                    const scale = parseFloat(this.value);
                    totalPriceScaleValue.textContent = scale + 'x';
                    sessionStorage.setItem('totalPriceScale', scale);
                    priceScale = scale;
                    const priceEl = document.getElementById('total-price');
                    if (priceEl && typeof updatePriceTransform === 'function') {
                        updatePriceTransform(priceEl);
                    } else if (priceEl) {
                         priceEl.style.transform = `scale(${scale})`;
                    }
                });
            }
        }
        
        // 应用字体设置
        function applyFontSettings() {
            const savedFontSize = sessionStorage.getItem('fontSize') || '16';
            const savedFontSpacing = sessionStorage.getItem('fontSpacing') || '2';
            
            const summaryPanel = document.querySelector('.summary-panel');
            if (summaryPanel) {
                // 计算缩放比例，以16px为基准
                const scale = parseInt(savedFontSize) / 16;
                summaryPanel.style.setProperty('--font-scale', scale);
                summaryPanel.style.letterSpacing = savedFontSpacing + 'px';
            }
        }

        // 应用当前配置列数设置
        function applySummaryCols() {
            const savedSummaryCols = sessionStorage.getItem('summaryCols') || '2';
            const selectedParts = document.querySelector('.selected-parts');
            if (selectedParts) {
                selectedParts.style.setProperty('--summary-cols', savedSummaryCols);
            }
        }

        // 应用当前配置型号大小设置
        function applyPartModelSettings() {
            const savedPartModelScale = sessionStorage.getItem('partModelScale') || '1.0';
            const summaryPanel = document.querySelector('.summary-panel');
            if (summaryPanel) {
                summaryPanel.style.setProperty('--part-model-scale', savedPartModelScale);
            }
        }

        // 应用当前配置详细信息大小设置
        function applyPartSpecsSettings() {
            const savedPartSpecsScale = sessionStorage.getItem('partSpecsScale') || '1.0';
            const summaryPanel = document.querySelector('.summary-panel');
            if (summaryPanel) {
                summaryPanel.style.setProperty('--part-specs-scale', savedPartSpecsScale);
            }
        }

        // 应用硬件列表字体设置
        function applyHardwareFontSettings() {
            const savedHardwareFontScale = sessionStorage.getItem('hardwareFontScale') || '1.0';
            const contentArea = document.querySelector('.content-area');
            if (contentArea) {
                contentArea.style.setProperty('--hardware-font-scale', savedHardwareFontScale);
            }
        }

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            // 页面加载时应用保存的缩放设置
            applySavedScales();
            // 初始化缩放控制
            initScaleControls();
        });

        // 备用图标加载方案
        window.lucideLoadAttempts = 0;
        window.initCalled = false;
        
        function tryLoadLucide() {
            if (typeof lucide !== 'undefined') {
                console.log('Lucide图标库加载成功');
                if (typeof init === 'function' && !window.initCalled) {
                    window.initCalled = true;
                    init();
                }
            } else if (window.lucideLoadAttempts < 2) {
                window.lucideLoadAttempts++;
                console.log('尝试重新加载Lucide图标库...', window.lucideLoadAttempts);
                setTimeout(tryLoadLucide, 200);
            } else {
                console.warn('Lucide图标库加载超时，强制初始化...');
                // 即使加载失败也初始化
                if (typeof init === 'function' && !window.initCalled) {
                    window.initCalled = true;
                    init();
                }
            }
        }
        
        // 页面加载时自动尝试加载
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', tryLoadLucide);
        } else {
            tryLoadLucide();
        }
    </script>
</head>

        ws.onmessage = (event) => {
            console.log('Customer received message (raw):', event.data);
            try {
                // 如果是字符串，尝试解析
                let data = event.data;
                if (typeof data === 'string') {
                    // 尝试解析 JSON
                    try {
                        data = JSON.parse(data);
                    } catch (e) {
                        // 如果不是 JSON，就按原样处理（虽然这里预期是 JSON）
                        console.log('Received non-JSON message');
                    }
                }
                
                if (data && data.type === 'updateConfig') {
                    console.log('Processing config update:', data.config);
                    currentConfig = data.config;
                    updateSummary();
                    
                    // Persistence: Save to LocalStorage
                    localStorage.setItem('customerCurrentConfig', JSON.stringify(currentConfig));
                }
            } catch (error) {
                console.error('Error processing message:', error);

        // 从本地存储加载修改过的硬件数据
        function loadModifiedHardware() {
            try {
                const modifiedHardware = localStorage.getItem('modifiedHardware');
                if (modifiedHardware) {
                    const parsed = JSON.parse(modifiedHardware);
                    
                    // 合并修改过的硬件数据到原始数据库
                    Object.keys(parsed).forEach(category => {
                        if (!hardwareData[category]) {
                            hardwareData[category] = [];
                        }
                        
                        parsed[category].forEach(modifiedItem => {
                            const existingIndex = hardwareData[category].findIndex(item => item.id === modifiedItem.id);
                            if (existingIndex !== -1) {
                                hardwareData[category][existingIndex] = modifiedItem;
                            } else {
                                hardwareData[category].push(modifiedItem);
                            }
                        });
                    });
                }
            } catch (error) {
                console.error('加载修改的硬件数据失败:', error);
            }
        }

        // 保存修改过的硬件数据到本地存储
        function saveModifiedHardware() {
            const modifiedHardware = {};
            
            Object.keys(hardwareData).forEach(category => {
                const modifiedItems = hardwareData[category].filter(item => 
                    item.id && (item.isModified || item.isCustom)
                );
                if (modifiedItems.length > 0) {
                    modifiedHardware[category] = modifiedItems;
                }
            });
            
            localStorage.setItem('modifiedHardware', JSON.stringify(modifiedHardware));
        }

        // 设置搜索功能
        function setupSearchFunctionality() {
            const searchInput = document.getElementById('hardware-search');
            const suggestionsContainer = document.getElementById('search-suggestions');
            
            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                if (query.length > 0) {
                    const suggestions = searchHardware(query);
                    showSearchSuggestions(suggestions);
                } else {
                    suggestionsContainer.style.display = 'none';
                }
            });
            
            searchInput.addEventListener('focus', (e) => {
                if (e.target.value.trim()) {
                    const query = e.target.value.toLowerCase().trim();
                    const suggestions = searchHardware(query);
                    showSearchSuggestions(suggestions);
                }
            });
            
            searchInput.addEventListener('blur', () => {
                setTimeout(() => {
                    suggestionsContainer.style.display = 'none';
                }, 200);
            });
        }

        // 搜索硬件
        function searchHardware(query) {
            const results = [];
            
            Object.keys(hardwareData).forEach(category => {
                if (Array.isArray(hardwareData[category])) {
                    hardwareData[category].forEach(item => {
                        // 确保属性存在再调用toLowerCase
                        const name = item.name ? item.name.toLowerCase() : '';
                        const brand = item.brand ? item.brand.toLowerCase() : '';
                        const specs = item.specs ? item.specs.toLowerCase() : '';
                        
                        if (name.includes(query) || 
                            brand.includes(query) ||
                            specs.includes(query)) {
                            results.push({...item, category});
                        }
                    });
                }
            });
            
            // 增加结果数量限制，从10改为100，解决搜索不到部分硬件的问题
            return results.slice(0, 100); 
        }

        // 显示搜索建议
        function showSearchSuggestions(suggestions) {
            const suggestionsContainer = document.getElementById('search-suggestions');
            suggestionsContainer.innerHTML = '';
            
            suggestions.forEach(item => {
                const suggestionItem = document.createElement('div');
                suggestionItem.className = 'suggestion-item';
                suggestionItem.innerHTML = `
                    <div class="font-medium">${item.name}</div>
                    <div class="text-sm text-gray-400">${item.category} - ${item.price}元</div>
                `;
                
                suggestionItem.addEventListener('click', () => {
                    // 切换到对应分类
                    document.querySelectorAll('.category-btn').forEach(btn => {
                        btn.classList.remove('active');
                        if (btn.dataset.category === item.category) {
                            btn.classList.add('active');
                        }
                    });
                    
                    loadCategory(item.category);
                    selectHardware(item);
                    document.getElementById('hardware-search').value = '';
                    suggestionsContainer.style.display = 'none';
                });
                
                suggestionsContainer.appendChild(suggestionItem);
            });
            
            if (suggestions.length === 0) {
                const noResults = document.createElement('div');
                noResults.className = 'suggestion-item text-center text-gray-400';
                noResults.textContent = '未找到匹配的硬件';
                suggestionsContainer.appendChild(noResults);
            }
            
            suggestionsContainer.style.display = 'block';
        }

        // 添加新硬件函数（支持所有分类）
        function addCustomHardware() {
            console.log('开始添加新硬件...');
            
            // 获取表单元素
            const form = document.getElementById('custom-form');
            if (!form) {
                console.error('找不到表单元素');
                alert('系统错误：找不到表单元素，请刷新页面重试。');
                return;
            }
            
            // 获取当前选择的分类
            const category = document.getElementById('modal-category').value;
            const name = document.getElementById('custom-name').value.trim();
            const price = parseFloat(document.getElementById('custom-price').value);
            const quantity = parseInt(document.getElementById('custom-quantity').value) || 1;
            const specs = document.getElementById('custom-specs').value.trim() || '自定义硬件';
            
            console.log('表单数据:', { category, name, price, quantity, specs });
            
            // 验证输入
            if (!name) {
                alert('请输入硬件名称！');
                return;
            }
            
            if (isNaN(price) || price < 0) {
                alert('请输入有效的价格！');
                return;
            }
            
            if (quantity < 1) {
                alert('数量至少为1！');
                return;
            }
            
            // 检查是否处于编辑模式
            const isEditMode = form.dataset.editMode === 'true';
            const editId = form.dataset.editId;
            const isCustomHardware = form.dataset.isCustomHardware === 'true';
            
            console.log('编辑模式:', isEditMode, '编辑ID:', editId, '是否自定义硬件:', isCustomHardware);
            
            if (isEditMode && editId) {
                // 编辑现有硬件
                console.log('处理编辑模式');
                
                if (isCustomHardware) {
                    // 编辑自定义配件
                    const editIndex = parseInt(form.dataset.editIndex);
                    console.log('编辑自定义配件，索引:', editIndex);
                    
                    if (editIndex >= 0 && editIndex < customHardwareData.length) {
                        const updatedItem = {
                            ...customHardwareData[editIndex],
                            name: name,
                            price: price,
                            quantity: quantity,
                            specs: specs,
                            isCustom: true
                        };
                        customHardwareData[editIndex] = updatedItem;
                        localStorage.setItem('customHardwareData', JSON.stringify(customHardwareData));
                        console.log('自定义配件已更新:', updatedItem);
                        
                        // 同时更新当前配置中的对应项
                        if (currentConfig.other) {
                            currentConfig.other = currentConfig.other.map(item => 
                                item.id === editId ? { ...updatedItem, originalPrice: item.originalPrice } : item
                            );
                        }
                        
                        console.log('自定义配件更新成功:', updatedItem);
                    }
                } else {
                    // 编辑标准硬件
                    const hardwareList = hardwareData[category] || [];
                    const itemIndex = hardwareList.findIndex(hw => hw.id === editId);
                    
                    if (itemIndex !== -1) {
                        const updatedItem = {
                            ...hardwareList[itemIndex],
                            name: name,
                            price: price,
                            specs: specs,
                            isModified: true
                        };
                        hardwareList[itemIndex] = updatedItem;
                        saveModifiedHardware();
                        console.log('标准硬件已更新:', updatedItem);
                        
                        // 同时更新当前配置中的对应项
                        if (currentConfig[category] && currentConfig[category].id === editId) {
                            currentConfig[category] = { ...updatedItem, originalPrice: currentConfig[category].originalPrice };
                        }
                    }
                }
            } else {
                // 创建新的硬件项目
                const newItem = {
                    id: `custom-${Date.now()}`,
                    name: name,
                    price: price,
                    quantity: quantity,
                    specs: specs,
                    brand: '自定义',
                    category: category,
                    isCustom: true
                };
                
                console.log('创建新硬件:', newItem);
                console.log('新硬件分类:', category);
                
                try {
                    // 根据分类添加到对应的数据库
                    if (category === 'other') {
                        // 添加到自定义配件数据库
                        customHardwareData.push(newItem);
                        // 保存自定义配件数据
                        localStorage.setItem('customHardwareData', JSON.stringify(customHardwareData));
                        console.log('新硬件已添加到自定义配件数据库');
                    } else {
                        // 添加到对应分类的硬件数据库
                        if (!hardwareData[category]) {
                            hardwareData[category] = [];
                            console.log('创建新的分类数组:', category);
                        }
                        hardwareData[category].push(newItem);
                        // 保存修改过的硬件数据
                        saveModifiedHardware();
                        console.log('新硬件已添加到标准硬件数据库');
                    }
                    
                    console.log('添加后的数据库状态:');
                    console.log('自定义配件数量:', customHardwareData.length);
                    console.log(`${category}分类数量:`, hardwareData[category] ? hardwareData[category].length : 0);
                } catch (error) {
                    console.error('添加硬件到数据库时出错:', error);
                    alert('保存硬件数据时出错，请刷新页面重试。');
                    return;
                }
            }
            
            // 重置表单并关闭模态框
            try {
                document.getElementById('custom-form').reset();
                closeModal();
                
                // 重新渲染当前分类的列表
                console.log('重新渲染硬件列表，分类:', category);
                renderHardwareList(category);
                updateSummary();
                saveAppState(); // 保存状态
                
                console.log('添加/编辑硬件操作完成');
            } catch (error) {
                console.error('更新界面时出错:', error);
                alert('更新界面时出错，请刷新页面重试。');
            }
        }

        // 删除硬件
        function deleteHardware(category, id) {
            console.log('删除硬件，分类:', category, 'ID:', id);
            
            let hardwareList = null;
            let isCustomHardware = false;
            
            // 根据分类查找硬件
            if (category === 'other') {
                // 在自定义配件数据库中查找
                hardwareList = customHardwareData;
                isCustomHardware = true;
            } else {
                // 在标准硬件数据库中查找
                hardwareList = hardwareData[category] || [];
            }
            
            // 查找硬件索引
            const index = hardwareList.findIndex(hw => hw.id === id);
            if (index === -1) {
                console.error('未找到要删除的硬件:', id);
                alert('未找到要删除的硬件！');
                return;
            }
            
            const item = hardwareList[index];
            
            // 检查是否在当前配置中使用
            let inUse = false;
            if (category === 'other') {
                // 检查自定义配件是否在当前配置中
                if (currentConfig.other) {
                    currentConfig.other = currentConfig.other.filter(item => 
                        item.id === id ? { ...updatedItem, originalPrice: item.originalPrice } : item
                    );
                }
            } else {
                // 检查标准硬件是否在当前配置中
                if (currentConfig[category] && currentConfig[category].id === id) {
                    inUse = true;
                }
            }
            
            if (inUse) {
                if (!confirm(`"${item.name}" 正在当前配置中使用，删除后将从配置中移除。确定要删除吗？`)) {
                    return;
                }
                
                // 从当前配置中移除
                if (category === 'other') {
                    currentConfig.other = currentConfig.other.filter(hw => hw.id !== id);
                } else {
                    currentConfig[category] = null;
                }
            } else {
                if (!confirm(`确定要删除 "${item.name}" 吗？`)) {
                    return;
                }
            }
            
            // 从数据库中删除
            hardwareList.splice(index, 1);
            
            // 保存数据
            if (isCustomHardware) {
                saveCustomHardwareData();
            } else {
                saveModifiedHardware();
            }
            
            console.log('硬件已删除:', item);
            
            // 重新渲染列表和摘要
            renderHardwareList(category);
            updateSummary();
            saveAppState(); // 保存状态
        }

        // 编辑硬件（支持所有分类和自定义硬件）
        function editHardware(category, id) {
            console.log('编辑硬件，分类:', category, 'ID:', id);
            
            let item = null;
            let hardwareList = null;
            let isCustomHardware = false;
            
            // 根据分类查找硬件
            if (category === 'other') {
                // 在自定义配件数据库中查找
                hardwareList = customHardwareData;
                item = hardwareList.find(hw => hw.id === id);
                isCustomHardware = true;
                console.log('在自定义配件数据库中查找，找到:', !!item);
            } else {
                // 在标准硬件数据库中查找
                hardwareList = hardwareData[category] || [];
                item = hardwareList.find(hw => hw.id === id);
                console.log('在标准硬件数据库中查找，找到:', !!item);
            }
            
            if (item) {
                console.log('找到要编辑的硬件:', item);
                
                // 填充模态框数据

                }
                
                modalCategory.value = category;

                customName.value = item.name;
                customPrice.value = item.price;

                // 保存编辑模式和硬件信息
                customForm.dataset.editMode = 'true';
                customForm.dataset.editCategory = category;
                customForm.dataset.editId = id;
                customForm.dataset.isCustomHardware = isCustomHardware;
                
                // 对于自定义配件，保存索引
                if (isCustomHardware) {
                    const index = hardwareList.indexOf(item);

        }

        // 计算预设总价格
        function calculatePresetTotalPrice(config) {
            let total = 0;
            
            // 计算标准组件价格
            Object.keys(config).forEach(category => {
                if (category !== 'other' && config[category]) {
                    total += config[category].price;
                }
            });
            
            // 计算自定义组件价格
            if (config.other && config.other.length > 0) {
                config.other.forEach(item => {
                    total += item.price * (item.quantity || 1);
                });
            }
            
            return total;
        }

        // 创建预设
        function createPreset() {
            const name = document.getElementById('preset-name').value.trim();
            const description = document.getElementById('preset-description').value.trim();
            
            if (!name) {
                alert('请输入预设名称！');
                return;
            }
            
            // 检查当前配置是否有选择的硬件
            const hasSelectedHardware = Object.values(currentConfig).some(item => 
                item !== null && (typeof item === 'object' && item.id) || 
                (Array.isArray(item) && item.length > 0)
            );
            
            if (!hasSelectedHardware) {
                alert('当前配置中没有选择任何硬件，请先选择硬件再创建预设！');
                return;
            }
            
            // 创建新预设
            const newPreset = {
                id: `preset-${Date.now()}`,
                name: name,
                description: description,
                config: JSON.parse(JSON.stringify(currentConfig)), // 深拷贝当前配置
                createdAt: new Date().toISOString()
            };
            
            // 添加到预设列表
            presetConfigs.push(newPreset);
            
            // 保存预设数据
            savePresetConfigs();
            
            // 重新渲染预设列表
            renderPresetList();
            
            // 隐藏创建表单
            hideCreatePresetForm();
            
            console.log('预设创建成功:', newPreset);
        }

        // 应用预设
        function applyPreset(index) {
            if (index >= 0 && index < presetConfigs.length) {
                const preset = presetConfigs[index];
                
                // 确认是否应用预设
                if (confirm(`确定要应用预设"${preset.name}"吗？这将替换当前的配置。`)) {
                    // 应用预设配置
                    let newConfig = JSON.parse(JSON.stringify(preset.config)); // 深拷贝预设配置
                    
                    // --- 修复逻辑：使用当前硬件数据库的最新价格更新配置 ---
                    console.log('正在根据当前数据库同步预设价格...');
                    
                    // 辅助函数：查找硬件
                    const findHardware = (category, id) => {
                        // 1. 在对应分类的标准库中查找
                        if (hardwareData[category] && Array.isArray(hardwareData[category])) {
                            const found = hardwareData[category].find(h => h.id === id);
                            if (found) return found;
                        }
                        
                        // 2. 在自定义硬件库中查找
                        const foundCustom = customHardwareData.find(h => h.id === id);
                        if (foundCustom) return foundCustom;
                        
                        // 3. 全局查找（作为兜底）
                        for (const cat in hardwareData) {
                            if (Array.isArray(hardwareData[cat])) {
                                const found = hardwareData[cat].find(h => h.id === id);
                                if (found) return found;
                            }
                        }
                        return null;
                    };

                    // 遍历配置并更新
                    Object.keys(newConfig).forEach(key => {
                        if (key === 'other') {
                            // 处理其他配件/自定义配件列表
                            if (Array.isArray(newConfig.other)) {
                                newConfig.other.forEach((item, idx) => {
                                    if (item && item.id) {
                                        const currentHardware = findHardware(item.category || 'other', item.id);
                                        if (currentHardware) {
                                            console.log(`同步价格: ${item.name} (${item.price} -> ${currentHardware.price})`);
                                            // 更新价格和基本信息，保留数量
                                            newConfig.other[idx].price = currentHardware.price;
                                            newConfig.other[idx].name = currentHardware.name;
                                            newConfig.other[idx].specs = currentHardware.specs;
                                            newConfig.other[idx].brand = currentHardware.brand;
                                            newConfig.other[idx].originalPrice = currentHardware.price;
                                        }
                                    }
                                });
                            }
                        } else {
                            // 处理标准硬件槽位
                            const item = newConfig[key];
                            if (item && item.id) {
                                const currentHardware = findHardware(key, item.id);
                                if (currentHardware) {
                                    console.log(`同步价格: ${item.name} (${item.price} -> ${currentHardware.price})`);
                                    // 更新信息
                                    newConfig[key].price = currentHardware.price;
                                    newConfig[key].name = currentHardware.name;
                                    newConfig[key].specs = currentHardware.specs;
                                    newConfig[key].brand = currentHardware.brand;
                                    newConfig[key].originalPrice = currentHardware.price;
                                }
                            }
                        }
                    });
                    
                    currentConfig = newConfig;
                    
                    // 更新界面
                    renderHardwareList(currentCategory);
                    updateSummary();
                    saveAppState(); // 保存状态
                    
                    // 关闭模态框
                    closePresetModal();
                    
                    console.log('预设应用成功 (已同步最新价格):', preset.name);
                }
            }
        }

        let isPriceEditMode = false;
        // priceScale is global now

        function initPriceEditor() {
            const btnEdit = document.getElementById('btn-edit-price');
            const btnSave = document.getElementById('btn-save-price');
            const priceEl = document.getElementById('total-price');
            
            if (!btnEdit || !btnSave || !priceEl) return;
            
            // Load saved settings
            const savedPos = JSON.parse(sessionStorage.getItem('totalPricePos') || 'null');
            const savedScale = parseFloat(sessionStorage.getItem('totalPriceScale') || '1.0');
            
            if (savedPos) {
                priceEl.style.position = 'absolute';
                priceEl.style.left = savedPos.x + 'px';
                priceEl.style.top = savedPos.y + 'px';
                priceEl.style.transform = 'none'; 
            }
            if (savedScale !== 1.0) {
                priceScale = savedScale;
                updatePriceTransform(priceEl);
            }
            
            btnEdit.addEventListener('click', () => {
                togglePriceEditMode(true);
            });
            
            btnSave.addEventListener('click', () => {
                togglePriceEditMode(false);
            });
            
            // Drag logic
            let isDragging = false;
            let startX, startY, initialLeft, initialTop;
            
            priceEl.addEventListener('mousedown', (e) => {
                if (!isPriceEditMode) return;
                isDragging = true;
                priceEl.style.cursor = 'grabbing';
                
                // Ensure absolute positioning relative to nearest positioned ancestor (summary-header-top)
                if (window.getComputedStyle(priceEl).position !== 'absolute') {
                    // Switch to absolute while maintaining current visual position
                    const rect = priceEl.getBoundingClientRect();
                    const parent = priceEl.offsetParent || document.body;
                    const parentRect = parent.getBoundingClientRect();
                    
                    priceEl.style.position = 'absolute';
                    priceEl.style.left = (rect.left - parentRect.left) + 'px';
                    priceEl.style.top = (rect.top - parentRect.top) + 'px';
                    priceEl.style.margin = '0'; // Clear margins that might affect pos
                }
                
                startX = e.clientX;
                startY = e.clientY;
                initialLeft = parseFloat(priceEl.style.left) || 0;
                initialTop = parseFloat(priceEl.style.top) || 0;
                
                e.preventDefault();
            });
            
            window.addEventListener('mousemove', (e) => {
                if (!isDragging) return;
                const dx = e.clientX - startX;
                const dy = e.clientY - startY;
                priceEl.style.left = (initialLeft + dx) + 'px';
                priceEl.style.top = (initialTop + dy) + 'px';
            });
            
            window.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    priceEl.style.cursor = 'grab';
                    // Save pos
                    const pos = {
                        x: parseFloat(priceEl.style.left),
                        y: parseFloat(priceEl.style.top)
                    };
                    sessionStorage.setItem('totalPricePos', JSON.stringify(pos));
                }
            });
            
            // Wheel Scale logic
            priceEl.addEventListener('wheel', (e) => {
                if (!isPriceEditMode) return;
                e.preventDefault();
                const delta = e.deltaY > 0 ? -0.1 : 0.1;
                priceScale = Math.max(0.5, Math.min(5.0, priceScale + delta));
                priceScale = Math.round(priceScale * 10) / 10; // Round to match slider
                
                updatePriceTransform(priceEl);
                sessionStorage.setItem('totalPriceScale', priceScale);
                
                // Sync slider
                const slider = document.getElementById('total-price-scale-slider');
                const label = document.getElementById('total-price-scale-value');
                if (slider) slider.value = priceScale;
                if (label) label.textContent = priceScale + 'x';
            });
        }
        
        function updatePriceTransform(el) {
            // Apply scale. Note: font-size scaling is already applied via CSS variables.
            // This is an EXTRA transform scale.
            el.style.transform = `scale(${priceScale})`;
        }

        function togglePriceEditMode(active) {

            const btnEdit = document.getElementById('btn-edit-price');

                priceEl.title = "";
            }
        }

        // 从当前配置中移除硬件
        function removeFromConfig(category, id) {
            console.log('从当前配置中移除硬件:', category, id);
            
            let itemToRemove = null;
            
            if (category === 'other') {
                // 从自定义配件数组中移除
                const index = currentConfig.other.findIndex(item => item.id === id);
                if (index !== -1) {
                    itemToRemove = currentConfig.other[index];
                    currentConfig.other.splice(index, 1);
                }
            } else {
                // 移除标准配件
                if (currentConfig[category] && currentConfig[category].id === id) {
                    itemToRemove = currentConfig[category];
                    currentConfig[category] = null;
                }
            }
            
            if (itemToRemove) {
                console.log('已移除:', itemToRemove.name);
                // 更新摘要
                updateSummary();
                saveAppState(); // 保存状态
                
                // 如果当前正在查看该分类，重新渲染列表以更新选中状态
                if (currentCategory === category) {
                    renderHardwareList(category);
                }
            }
        }

        function editConfigItem(category, id) {
            console.log('编辑当前配置中的硬件:', category, id);
            
            let item = null;
            if (category === 'other') {
                item = currentConfig.other.find(i => i.id === id);
            } else {
                item = currentConfig[category];
            }
            
            if (!item) {
                console.error('未找到要编辑的硬件');
                alert('未找到要编辑的硬件！');
                return;

            const form = document.getElementById('config-edit-form');

            document.getElementById('config-edit-price').value = item.price;
            document.getElementById('config-edit-quantity').value = item.quantity || 1;
            document.getElementById('config-edit-specs').value = item.specs || '';

            const originalPriceInfo = document.getElementById('original-price-info');

                originalPriceInfo.textContent = `原始价格: ¥${item.originalPrice.toLocaleString()}`;

        // 保存配置编辑
        function saveConfigEdit() {
            const form = document.getElementById('config-edit-form');
            const category = form.dataset.category;
            const id = form.dataset.id;
            
            const name = document.getElementById('config-edit-name').value.trim();
            const price = parseFloat(document.getElementById('config-edit-price').value);
            const quantity = parseInt(document.getElementById('config-edit-quantity').value);
            const specs = document.getElementById('config-edit-specs').value.trim();
            
            if (!name || isNaN(price) || price < 0 || isNaN(quantity) || quantity < 1) {
                alert('请填写有效的信息！');
                return;
            }
            
            // 更新硬件信息
            let updated = false;
            if (category === 'other') {
                const index = currentConfig.other.findIndex(item => item.id === id);
                if (index !== -1) {
                    currentConfig.other[index].name = name;
                    currentConfig.other[index].price = price;
                    currentConfig.other[index].quantity = quantity;
                    currentConfig.other[index].specs = specs; // Always update specs
                    updated = true;
                }
            } else {
                if (currentConfig[category] && currentConfig[category].id === id) {
                    currentConfig[category].name = name;
                    currentConfig[category].price = price;
                    currentConfig[category].quantity = quantity;
                    currentConfig[category].specs = specs; // Always update specs
                    updated = true;
                }
            }
            
            if (updated) {
                console.log('配置编辑已保存:', category, id);
                // 关闭模态框
                document.getElementById('config-edit-modal').classList.add('hidden');
                // 重置表单
                form.reset();
                // 更新摘要
                updateSummary();
                saveAppState(); // 保存状态
                // 如果当前正在查看该分类，重新渲染列表以更新显示
                if (currentCategory === category) {
                    renderHardwareList(category);
                }
            } else {
                console.error('保存配置编辑失败：未找到目标硬件');
                alert('保存失败：未找到目标硬件！');
            }
        }

        // 保存到本地文件
        async function saveToLocalFile() {
            console.log('开始导出数据文件');
            
            // 收集所有数据
            const exportData = {
                hardwareData: hardwareData,
                currentConfig: currentConfig,
                modifiedHardware: JSON.parse(localStorage.getItem('modifiedHardware') || '{}'),
                savedConfigs: JSON.parse(localStorage.getItem('pcConfigs') || '[]'),
                presetConfigs: presetConfigs,
                customHardwareData: customHardwareData,
                // 导出界面设置
                settings: {
                    summaryScale: sessionStorage.getItem('summaryScale'),
                    hardwareScale: sessionStorage.getItem('hardwareScale'),
                    fontSize: sessionStorage.getItem('fontSize'),
                    summaryCols: sessionStorage.getItem('summaryCols'),
                    partModelScale: sessionStorage.getItem('partModelScale'),
                    partSpecsScale: sessionStorage.getItem('partSpecsScale'),
                    fontSpacing: sessionStorage.getItem('fontSpacing'),
                    hardwareFontScale: sessionStorage.getItem('hardwareFontScale'),
                    totalPricePos: sessionStorage.getItem('totalPricePos'),
                    totalPriceScale: sessionStorage.getItem('totalPriceScale')
                },
                exportTime: new Date().toISOString()
            };
            
            // 创建JSON字符串
            const jsonString = JSON.stringify(exportData, null, 2);
            const blob = new Blob([jsonString], { type: 'application/json' });
            
            // 检查是否支持文件系统API
            if (window.showSaveFilePicker) {
                try {
                    // 使用现代浏览器的文件系统API
                    const options = {
                        suggestedName: `pc-builder-data-${new Date().toISOString().split('T')[0]}.json`,
                        types: [
                            {
                                description: 'JSON 文件',
                                accept: { 'application/json': ['.json'] }
                            }
                        ]
                    };
                    
                    const handle = await window.showSaveFilePicker(options);
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    
                    console.log('数据文件已成功保存');
                    alert('数据已成功保存到您选择的位置！');
                } catch (err) {
                    console.log('用户取消了文件保存或发生错误:', err);
                    if (err.name !== 'AbortError') {
                        // 如果不是用户取消，使用备用方法
                        fallbackSaveToLocalFile(blob);
                    }
                }
            } else {
                // 备用方法：使用传统的下载方式
                fallbackSaveToLocalFile(blob);
            }
        }
        
        // 备用保存方法（传统下载）
        function fallbackSaveToLocalFile(blob) {
            console.log('使用备用方法保存文件');
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `pc-builder-data-${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            URL.revokeObjectURL(url);
            
            alert('数据已保存到浏览器默认下载位置！');
        }

        // 从文件导入数据
        function importDataFromFile(file) {
            if (!file) {
                console.log('未选择文件');
                return;
            }
            
            console.log('开始导入数据文件:', file.name);
            
            const reader = new FileReader();
            
            reader.onload = function(e) {
                try {
                    const importData = JSON.parse(e.target.result);
                    
                    // 验证数据格式
                    if (!importData.hardwareData || !importData.currentConfig) {
                        throw new Error('无效的数据文件格式');
                    }
                    
                    // 确认是否覆盖现有数据
                    if (confirm('确定要导入数据吗？这将覆盖当前的所有数据，包括已选择的硬件配置和自定义硬件。')) {
                        try {
                            // 全量覆盖数据
                            // 1. 恢复硬件数据库（直接全量覆盖）
                            if (importData.hardwareData) {
                                hardwareData = JSON.parse(JSON.stringify(importData.hardwareData));
                                
                                // 兼容性处理：如果导入的数据中没有某些分类的数组，初始化为空数组
                                const categories = ['cpu', 'motherboard', 'ram', 'gpu', 'cooling', 'storage', 'psu', 'case', 'fans', 'other'];
                                categories.forEach(cat => {
                                    if (!hardwareData[cat]) {
                                        hardwareData[cat] = [];
                                    }
                                });
                            }
                            
                            // 2. 恢复当前配置
                            if (importData.currentConfig) {
                                currentConfig = JSON.parse(JSON.stringify(importData.currentConfig));
                                
                                // 兼容性处理：确保 currentConfig 包含所有必要字段
                                const configKeys = ['cpu', 'motherboard', 'ram', 'gpu', 'cooling', 'storage', 'psu', 'case', 'fans', 'other'];
                                configKeys.forEach(key => {
                                    if (currentConfig[key] === undefined) {
                                        if (key === 'other') {
                                            currentConfig[key] = [];
                                        } else {
                                            currentConfig[key] = null;
                                        }
                                    }
                                });
                            }
                            
                            // 3. 恢复预设配置 (智能合并)
                            if (importData.presetConfigs) {
                                const importedPresets = importData.presetConfigs;
                                // 简单合并：如果ID不同则添加
                                importedPresets.forEach(importedPreset => {
                                    if (!presetConfigs.some(p => p.id === importedPreset.id)) {
                                        presetConfigs.push(importedPreset);
                                    }
                                });
                                savePresetConfigs();
                            }
                            
                            // 4. 恢复自定义硬件数据
                            if (importData.customHardwareData) {
                                customHardwareData = JSON.parse(JSON.stringify(importData.customHardwareData));
                            }

                            // 5. 恢复界面设置 (已禁用：根据用户要求，导入时不覆盖界面设置)
                            /*
                            if (importData.settings) {
                                const s = importData.settings;
                                if (s.summaryScale) sessionStorage.setItem('summaryScale', s.summaryScale);
                                if (s.hardwareScale) sessionStorage.setItem('hardwareScale', s.hardwareScale);
                                if (s.fontSize) sessionStorage.setItem('fontSize', s.fontSize);
                                if (s.summaryCols) sessionStorage.setItem('summaryCols', s.summaryCols);
                                if (s.partModelScale) sessionStorage.setItem('partModelScale', s.partModelScale);
                                if (s.partSpecsScale) sessionStorage.setItem('partSpecsScale', s.partSpecsScale);
                                if (s.fontSpacing) sessionStorage.setItem('fontSpacing', s.fontSpacing);
                                if (s.hardwareFontScale) sessionStorage.setItem('hardwareFontScale', s.hardwareFontScale);
                                if (s.totalPricePos) sessionStorage.setItem('totalPricePos', s.totalPricePos);
                                if (s.totalPriceScale) sessionStorage.setItem('totalPriceScale', s.totalPriceScale);
                            }
                            */
                            
                            // 关键：保存应用状态（全量保存）
                            saveAppState();
                            
                            // 清除旧的局部存储（防止冲突，或者可选保留）
                            // localStorage.removeItem('modifiedHardware'); 
                            // 保持 modifiedHardware 可能有助于兼容，但既然全量覆盖了，其实不需要了。
                            
                            if (importData.savedConfigs) {
                                localStorage.setItem('pcConfigs', JSON.stringify(importData.savedConfigs));
                            }
                            
                            // 重新初始化应用
                            loadCategory(currentCategory);
                            updateSummary();
                            
                            console.log('数据导入成功');
                            alert('数据导入成功！页面将刷新以确保所有更改生效。');
                            location.reload(); // 刷新页面最稳妥
                        } catch (err) {
                            console.error('应用导入数据时出错:', err);
                            alert('导入数据时出错，请检查文件格式。');
                        }
                    }
                } catch (error) {
                    console.error('解析数据文件失败:', error);
                    alert('无法解析数据文件，请确保文件格式正确。');
                }
            };
            
            reader.onerror = function(error) {
                console.error('读取文件时出错:', error);
                alert('读取文件失败，请重试。');
            };
            
            reader.readAsText(file);
        }




    </script>
</body>
</html>
